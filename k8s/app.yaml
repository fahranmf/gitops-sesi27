
apiVersion: v1
kind: Namespace
metadata:
  name: gitops-sesi27
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-html
  namespace: gitops-sesi27
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="id">
    <head>
      <meta charset="UTF-8">
      <title>Simple NGINX</title>
    </head>
    <body>
      <h1>Ini tampilan dari NGINX dan nama saya Fahran Maulana Febryan</h1>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-nginx
  namespace: gitops-sesi27
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simple-nginx
  template:
    metadata:
      labels:
        app: simple-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: html
          configMap:
            name: nginx-html
---
apiVersion: v1
kind: Service
metadata:
  name: simple-nginx
  namespace: gitops-sesi27
spec:
  type: ClusterIP
  selector:
    app: simple-nginx
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: httpd-html
  namespace: gitops-sesi27
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="id">
    <head>
      <meta charset="UTF-8">
      <title>Simple HTTPD</title>
    </head>
    <body>
      <h1>Ini tampilan dari HTTPD dan nama saya Fahran Maulana Febryan</h1>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-httpd
  namespace: gitops-sesi27
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simple-httpd
  template:
    metadata:
      labels:
        app: simple-httpd
    spec:
      containers:
        - name: httpd
          image: httpd:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/local/apache2/htdocs/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: html
          configMap:
            name: httpd-html
---
apiVersion: v1
kind: Service
metadata:
  name: simple-httpd
  namespace: gitops-sesi27
spec:
  type: ClusterIP
  selector:
    app: simple-httpd
  ports:
    - port: 80
      targetPort: 80
